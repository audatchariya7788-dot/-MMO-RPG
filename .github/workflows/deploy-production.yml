name: deploy-production

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in app.js game.js animation.js boot.js character-v3.js; do
            test -f "$f"
            node --check "$f"
          done

      - name: Validate canonical data
        shell: bash
        run: |
          set -euo pipefail
          test -f data/game-catalog.js
          test -f data/game-catalog.v6.json
          grep -q 'window.MMA_GAME_DATA' data/game-catalog.js
          grep -q 'data/game-catalog.js' index.html

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
