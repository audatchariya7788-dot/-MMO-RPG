name: MMA RPG Runtime QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required runtime files
        shell: bash
        run: |
          set -e
          required=(
            index.html
            style.css
            app.js
            animation.js
            phaseC.js
            phaseC.css
            character-v3.js
            character-v3.css
            run.sh
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - name: Start local runtime
        shell: bash
        run: |
          chmod +x run.sh
          ./run.sh >/tmp/mma-rpg-runtime.log 2>&1 &
          echo $! >/tmp/mma-rpg-runtime.pid
          sleep 2

      - name: HTTP smoke test
        shell: bash
        run: |
          set -e
          curl --fail --silent --show-error http://127.0.0.1:8000/ > /tmp/index.html
          grep -q "MMA : RPG" /tmp/index.html
          grep -q "character-v3.js" /tmp/index.html
          grep -q "v5-runtime-qa.js" /tmp/index.html

      - name: Runtime file smoke test
        shell: bash
        run: |
          set -e
          for f in phaseC.js character-v3.js runtime-qa.js v5-runtime-qa.js; do
            curl --fail --silent --show-error "http://127.0.0.1:8000/$f" >/dev/null
          done

      - name: Stop runtime
        if: always()
        shell: bash
        run: |
          if test -f /tmp/mma-rpg-runtime.pid; then kill "$(cat /tmp/mma-rpg-runtime.pid)" || true; fi
