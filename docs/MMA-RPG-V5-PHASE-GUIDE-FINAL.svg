<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<rect width="1800" height="1200" fill="#050b16"/>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102c50"/><stop offset="1" stop-color="#071321"/></linearGradient><style>
.t{font-family:Arial,sans-serif}.title{font:700 52px Arial;fill:#ffd447}.sub{font:600 22px Arial;fill:#dbeafe}.h{font:700 26px Arial;fill:#fff}.txt{font:500 18px Arial;fill:#cbd5e1}.id{font:700 16px monospace;fill:#67e8f9}.ok{font:700 17px Arial;fill:#86efac}.phase{font:800 21px Arial;fill:#ffd447}
</style></defs>
<rect x="35" y="28" width="1730" height="125" rx="24" fill="url(#bg)" stroke="#38bdf8" stroke-width="3"/>
<text x="900" y="82" text-anchor="middle" class="title">MMA : RPG V5 — FINAL DESIGN / IMPLEMENTATION GUIDE</text>
<text x="900" y="120" text-anchor="middle" class="sub">Runtime V5 • Asset IDs • 32×32 Grid • Data Flow • Phase 1–7</text>

<!-- canonical runtime -->
<text x="900" y="205" text-anchor="middle" class="h">CANONICAL RUNTIME FLOW</text>
<g class="t">
<g transform="translate(55,235)"><rect width="185" height="82" rx="14" fill="#12355d" stroke="#38bdf8"/><text x="92" y="35" text-anchor="middle" class="h">BOOT</text><text x="92" y="62" text-anchor="middle" class="id">SYS-RUNTIME</text></g>
<text x="248" y="285" class="title">→</text>
<g transform="translate(275,235)"><rect width="185" height="82" rx="14" fill="#12355d" stroke="#38bdf8"/><text x="92" y="35" text-anchor="middle" class="h">WORLD</text><text x="92" y="62" text-anchor="middle" class="id">MAP-*</text></g>
<text x="468" y="285" class="title">→</text>
<g transform="translate(495,235)"><rect width="185" height="82" rx="14" fill="#153d61" stroke="#22d3ee"/><text x="92" y="35" text-anchor="middle" class="h">CHARACTER</text><text x="92" y="62" text-anchor="middle" class="id">CHR-*</text></g>
<text x="688" y="285" class="title">→</text>
