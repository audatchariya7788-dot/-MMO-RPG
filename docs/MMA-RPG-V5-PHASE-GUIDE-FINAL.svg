<text x="908" y="285" class="title">→</text>
<g transform="translate(935,235)"><rect width="185" height="82" rx="14" fill="#283c20" stroke="#84cc16"/><text x="92" y="35" text-anchor="middle" class="h">STATS</text><text x="92" y="62" text-anchor="middle" class="id">STAT-V5</text></g>
<text x="1128" y="285" class="title">→</text>
<g transform="translate(1155,235)"><rect width="185" height="82" rx="14" fill="#551d2a" stroke="#fb7185"/><text x="92" y="35" text-anchor="middle" class="h">BATTLE</text><text x="92" y="62" text-anchor="middle" class="id">MON-* / FX-*</text></g>
