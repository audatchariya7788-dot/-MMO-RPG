<text x="1568" y="285" class="title">→</text>
<g transform="translate(1595,235)"><rect width="170" height="82" rx="14" fill="#5b4217" stroke="#fbbf24"/><text x="85" y="35" text-anchor="middle" class="h">SAVE</text><text x="85" y="62" text-anchor="middle" class="id">SYS-SAVE</text></g>
</g>

<text x="900" y="365" text-anchor="middle" class="title">PHASE 1–7 • DEVELOPMENT GATES</text>
<!-- cards -->
<g transform="translate(45,400)"><rect width="540" height="205" rx="20" fill="url(#bg)" stroke="#38bdf8" stroke-width="2"/><text x="22" y="38" class="phase">PHASE 1 — RUNTIME FOUNDATION</text><text x="22" y="70" class="id">SYS-RUNTIME · SYS-SAVE</text><text x="22" y="108" class="txt">Boot / Menu / gameState / one renderer</text><text x="22" y="140" class="txt">NEW · CONTINUE · LOAD · normalize()</text><text x="22" y="178" class="ok">✓ Gate: no permanent Loading</text></g>
<g transform="translate(630,400)"><rect width="540" height="205" rx="20" fill="url(#bg)" stroke="#a78bfa" stroke-width="2"/><text x="22" y="38" class="phase">PHASE 2 — CHARACTER + EQUIPMENT</text><text x="22" y="70" class="id">CHR-* · WPN-* · EQ-*</text><text x="22" y="108" class="txt">4 classes + signature weapons + 6 slots</text><text x="22" y="140" class="txt">Modifiers → derived stats → shared state</text><text x="22" y="178" class="ok">✓ Gate: class/equipment sync</text></g>
<g transform="translate(1215,400)"><rect width="540" height="205" rx="20" fill="url(#bg)" stroke="#22d3ee" stroke-width="2"/><text x="22" y="38" class="phase">PHASE 3 — ASSET INTEGRATION</text><text x="22" y="70" class="id">ASSET-32X32 · CHR-FALLBACK</text><text x="22" y="108" class="txt">SVG source + 32×32 logical cell</text><text x="22" y="140" class="txt">Stable IDs + fallback-safe rendering</text><text x="22" y="178" class="ok">✓ Gate: no broken/local asset path</text></g>
<g transform="translate(45,630)"><rect width="540" height="205" rx="20" fill="url(#bg)" stroke="#4ade80" stroke-width="2"/><text x="22" y="38" class="phase">PHASE 4 — WORLD + QUEST</text><text x="22" y="70" class="id">MAP-* · NPC-* · QUEST-*</text><text x="22" y="108" class="txt">Greenvale movement + NPC interaction</text><text x="22" y="140" class="txt">Encounter triggers + quest persistence</text><text x="22" y="178" class="ok">✓ Gate: movement / quest state persists</text></g>
<g transform="translate(630,630)"><rect width="540" height="205" rx="20" fill="url(#bg)" stroke="#fb7185" stroke-width="2"/><text x="22" y="38" class="phase">PHASE 5 — BATTLE</text><text x="22" y="70" class="id">MON-* · FX-* · SKL-*</text><text x="22" y="108" class="txt">Attack · Skill · Heal · Potion · Run</text><text x="22" y="140" class="txt">Hit/Dodge → Crit → Damage → Victory</text><text x="22" y="178" class="ok">✓ Gate: shared formula + monster HP</text></g>
<g transform="translate(1215,630)"><rect width="540" height="205" rx="20" fill="url(#bg)" stroke="#f59e0b" stroke-width="2"/><text x="22" y="38" class="phase">PHASE 6 — LOOT + INVENTORY</text><text x="22" y="70" class="id">LOOT-* · ITM-*</text><text x="22" y="108" class="txt">Victory → EXP + Gold + Item records</text><text x="22" y="140" class="txt">Receive → Filter → Equip</text><text x="22" y="178" class="ok">✓ Gate: loot reaches inventory</text></g>
<g transform="translate(45,860)"><rect width="850" height="205" rx="20" fill="url(#bg)" stroke="#fbbf24" stroke-width="2"/><text x="22" y="38" class="phase">PHASE 7 — SAVE / LOAD + GM LAB</text><text x="22" y="70" class="id">SYS-SAVE · GM-*</text><text x="22" y="108" class="txt">mma-rpg-save-v2 full state round-trip</text><text x="22" y="140" class="txt">Class · Equipment · Inventory · Map · Quest · Loot</text><text x="22" y="178" class="ok">✓ Gate: normalize invalid save; GM tools test-only</text></g>
<g transform="translate(930,860)"><rect width="825" height="205" rx="20" fill="#091827" stroke="#64748b" stroke-width="2"/><text x="22" y="38" class="phase">FINAL CONTRACT / HANDOFF</text><text x="22" y="70" class="id">data/mma-rpg-v5-spec.json</text><text x="22" y="108" class="txt">Character Asset → Sprite 32×32 → Equipment → Stats</text><text x="22" y="140" class="txt">→ Battle → Loot → Inventory → Save / Load</text><text x="22" y="178" class="ok">✓ Source of truth: V5 Runtime + Master Design Spec</text></g>
<text x="900" y="1140" text-anchor="middle" class="sub">MMA : RPG V5 • Final Phase Guide • Use Asset IDs as the implementation contract</text>
</svg>
